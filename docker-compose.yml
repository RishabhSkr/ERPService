# ============================================
# MyERP Docker Compose — Poora System Ek Command Se!
# Usage: docker compose up -d --build
# ============================================

services:
  # ═══════════════════════════════════════
  # 🗄️ INFRASTRUCTURE (Pehle yeh start hote hain)
  # ═══════════════════════════════════════

  postgres:
    image: postgres:15-alpine
    container_name: myerp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PG_PASSWORD:-MyErpPassword123!}"
    ports:
      - "5432:5432"     # Host:Container
    volumes:
      - pgdata:/var/lib/postgresql/data  # Data persist
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: myerp-rabbitmq
    ports:
      - "5672:5672"     # App communication
      - "15672:15672"   # Management UI → browser: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: myerp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ═══════════════════════════════════════
  # 🔧 BACKEND SERVICES
  # ═══════════════════════════════════════

  identity-service:
    build:
      context: ./src                               # src/ level — consistent with others
      dockerfile: MyERP.Services.Identity/Dockerfile
    container_name: myerp-identity
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      # Double underscore (__) = JSON nesting
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=MyERP_Identity;Username=postgres;Password=${PG_PASSWORD:-MyErpPassword123!}"
      Jwt__Key: "${JWT_KEY:-ThisIsASecretKeyForMyERPProject_ChangeThisInProd123!}"
      Jwt__Issuer: "MyERP_Identity"
      Jwt__Audience: "MyERP_Clients"
    depends_on:
      postgres:
        condition: service_healthy

  sales-service:
    build:
      context: ./src                             # src/ level — Shared access ke liye!
      dockerfile: MyERP.Services.Sales/Dockerfile
    container_name: myerp-sales
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=SalesDb;Username=postgres;Password=${PG_PASSWORD:-MyErpPassword123!}"
      Jwt__Key: "${JWT_KEY:-ThisIsASecretKeyForMyERPProject_ChangeThisInProd123!}"
      Jwt__Issuer: "MyERP_Identity"
      Jwt__Audience: "MyERP_Clients"
      RabbitMQ__Uri: "${RABBITMQ_URI:-amqp://guest:guest@rabbitmq:5672/}"  # Local default, override in cloud
      Services__InventoryServiceUrl: "http://inventory-service:8080"
      Services__IdentityService__BaseUrl: "http://identity-service:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventory-service:
    build:
      context: ./src
      dockerfile: MyERP.Services.Inventory/Dockerfile
    container_name: myerp-inventory
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=MyERP_Inventory;Username=postgres;Password=${PG_PASSWORD:-MyErpPassword123!}"
      Jwt__Key: "${JWT_KEY:-ThisIsASecretKeyForMyERPProject_ChangeThisInProd123!}"
      Jwt__Issuer: "MyERP_Identity"
      Jwt__Audience: "MyERP_Clients"
      RabbitMQ__Uri: "${RABBITMQ_URI:-amqp://guest:guest@rabbitmq:5672/}"  # Local default, override in cloud
      Redis__ConnectionString: "redis:6379"      # redis = container name
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  production-service:
    build:
      context: ./src
      dockerfile: MyERP.Services.Production/Dockerfile
    container_name: myerp-production
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ProductionDb;Username=postgres;Password=${PG_PASSWORD:-MyErpPassword123!}"
      Jwt__Key: "${JWT_KEY:-ThisIsASecretKeyForMyERPProject_ChangeThisInProd123!}"
      Jwt__Issuer: "MyERP_Identity"
      Jwt__Audience: "MyERP_Clients"
      RabbitMQ__Uri: "${RABBITMQ_URI:-amqp://guest:guest@rabbitmq:5672/}"  # Local default, override in cloud
      Redis__ConnectionString: "redis:6379"
      Services__InventoryServiceUrl: "http://inventory-service:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: ./src
      dockerfile: MyERP.Gateway/Dockerfile
    container_name: myerp-gateway
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=MyERP_Identity;Username=postgres;Password=${PG_PASSWORD:-MyErpPassword123!}"
      Jwt__Key: "${JWT_KEY:-ThisIsASecretKeyForMyERPProject_ChangeThisInProd123!}"
      Jwt__Issuer: "MyERP_Identity"
      Jwt__Audience: "MyERP_Clients"
      # YARP — localhost ki jagah container names use karo!
      ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address: "http://identity-service:8080"
      ReverseProxy__Clusters__sales-cluster__Destinations__destination1__Address: "http://sales-service:8080"
      ReverseProxy__Clusters__inventory-cluster__Destinations__destination1__Address: "http://inventory-service:8080"
      ReverseProxy__Clusters__production-cluster__Destinations__destination1__Address: "http://production-service:8080"
    depends_on:
      - identity-service
      - sales-service
      - inventory-service
      - production-service

  # ═══════════════════════════════════════
  # 🖥️ FRONTEND
  # ═══════════════════════════════════════

  frontend:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile
    container_name: myerp-frontend
    ports:
      - "80:80"       # Browser: http://localhost
    depends_on:
      - gateway

# Persistent data — container delete karo, data rahega
volumes:
  pgdata:
