server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA Routing — React Router ke liye ZAROORI!
    # /dashboard, /sales/orders jaise routes pe direct jaao
    # toh Nginx ko index.html serve karna hai (React handle karega routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy — /api calls Gateway pe forward karo
    # Frontend: fetch('/api/auth/login')
    # Nginx:    → http://gateway:8080/api/auth/login
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files caching — images, CSS, JS ko browser cache kare
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
